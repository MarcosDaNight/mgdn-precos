[project]
name = "precos"
version = "0.1.0"
description = "Monitor pessoal de preços (Nintendo Switch 2) com alertas no ntfy"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pyyaml>=6", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
